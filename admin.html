<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | JGCC Smart Bulletin Board</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --navy: #07111f;
      --panel: #10243b;
      --blue: #38bdf8;
      --yellow: #facc15;
      --red: #ef4444;
      --green: #22c55e;
      --light: #f1f5f9;
      --text: #172033;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--text);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1b4975, transparent 45%), var(--navy);
    }
    .login-card {
      width: min(430px, 100%);
      padding: 35px;
      border: 1px solid #29476b;
      border-radius: 20px;
      text-align: center;
      color: white;
      background: var(--panel);
      box-shadow: 0 20px 70px rgba(0,0,0,0.5);
    }
    .logo {
      width: 70px;
      height: 70px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #111827;
      background: var(--yellow);
      font-size: 34px;
    }
    .login-card h1 { margin: 20px 0 8px; }
    .login-card p { color: #94a3b8; }
    label {
      display: block;
      margin: 17px 0 7px;
      text-align: left;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #365474;
      border-radius: 8px;
      outline: none;
      color: white;
      background: #142d48;
    }
    textarea { resize: vertical; }
    .primary-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      color: #06111e;
      background: var(--blue);
      font-weight: bold;
    }
    .error, .success {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
    }
    .error { color: #fecaca; background: #7f1d1d; }
    .success { color: #bbf7d0; background: #14532d; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 25px 5%;
      color: white;
      background: var(--navy);
    }
    .admin-header h1 { margin: 0 0 6px; }
    .admin-header p { margin: 0; color: #94a3b8; }
    .header-actions { display: flex; align-items: center; gap: 15px; }
    .connection-status { color: #86efac; font-size: 14px; font-weight: bold; }
    .logout-button, .small-button {
      padding: 9px 13px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #334155;
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 90%;
      max-width: 1400px;
      margin: 30px auto;
    }
    .stat-card {
      padding: 22px;
      border-radius: 13px;
      background: white;
      box-shadow: 0 3px 12px rgba(15,23,42,0.1);
    }
    .stat-card strong, .stat-card span { display: block; }
    .stat-card strong { color: #0369a1; font-size: 32px; }
    .stat-card span { margin-top: 5px; color: var(--muted); }
    .admin-content {
      display: grid;
      grid-template-columns: minmax(300px, 420px) 1fr;
      gap: 28px;
      width: 90%;
      max-width: 1400px;
      margin: auto;
    }
    .form-panel, .notices-panel, .links-panel {
      padding: 24px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 12px rgba(15,23,42,0.08);
    }
    .form-panel h2, .notices-panel h2, .links-panel h2 { margin-top: 0; }
    .form-panel label { color: var(--text); }
    .form-panel input, .form-panel textarea, .form-panel select {
      color: var(--text);
      border-color: #cbd5e1;
      background: white;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 8px;
    }
    .house-option { position: relative; }
    .house-option input { position: absolute; opacity: 0; }
    .house-option label {
      display: block;
      margin: 0;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      color: var(--text);
      cursor: pointer;
      font-weight: bold;
    }
    .house-option input:checked + label {
      background: #eaf5ff;
      border-color: var(--blue);
      color: #0b4e86;
    }
    .notice-card {
      margin-bottom: 18px;
      padding: 20px;
      border-left: 6px solid var(--blue);
      border-radius: 10px;
      background: #f8fafc;
    }
    .notice-card.important { border-left-color: var(--yellow); }
    .notice-card.urgent { border-left-color: var(--red); }
    .notice-top, .notice-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      color: #075985;
      background: #bae6fd;
      font-size: 12px;
      font-weight: bold;
    }
    .notice-card.important .badge { color: #854d0e; background: #fef08a; }
    .notice-card.urgent .badge { color: #991b1b; background: #fecaca; }
    .notice-card h3 {
      margin: 16px 0 8px;
      font-size: 23px;
      font-weight: 900;
    }
    .notice-card p {
      white-space: pre-wrap;
      color: #475569;
      line-height: 1.6;
      font-weight: 700;
    }
    .notice-bottom { color: var(--muted); font-size: 13px; font-weight: bold; }
    .notice-actions { display: flex; gap: 8px; }
    .delete-button { background: #b91c1c; }
    .links-panel {
      width: 90%;
      max-width: 1400px;
      margin: 28px auto 50px;
    }
    .display-link {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .display-link code { color: #475569; word-break: break-all; }
    .display-link a { color: #0369a1; font-weight: bold; }
    @media (max-width: 800px) {
      .admin-header { flex-direction: column; align-items: flex-start; }
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .admin-content { grid-template-columns: 1fr; }
      .display-link { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .dashboard-grid, .form-row, .checkbox-grid { grid-template-columns: 1fr; }
      .notice-top, .notice-bottom { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const USERNAME = "admin";
    const PASSWORD = "1234";
    const STORAGE_KEY = "cadet_college_notices";
    const HOUSE_META = {
      RH: { name: "Razia House", color: "#22c55e" },
      SH: { name: "Sitara House", color: "#7dd3fc" },
      TH: { name: "Taramon House", color: "#ef4444" }
    };

    function loadNotices() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    async function refreshFromSharedStore() {
      if (window.JGCCFirebase && typeof window.JGCCFirebase.getNotices === "function") {
        const remoteNotices = await window.JGCCFirebase.getNotices();
        if (Array.isArray(remoteNotices)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteNotices));
          return remoteNotices;
        }
      }
      return loadNotices();
    }

    function saveNotices(notices) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notices));
      if (window.JGCCFirebase && typeof window.JGCCFirebase.saveNotices === "function") {
        return window.JGCCFirebase.saveNotices(notices);
      }
      return Promise.resolve();
    }

    function escapeHTML(value) { return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;"); }

    function formatDate(value) {
      return new Date(value).toLocaleString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function createId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function normalizeTargets(targets) {
      if (Array.isArray(targets) && targets.length) return targets;
      return ["ALL"];
    }

    function houseLabels(targetsList) {
      const list = normalizeTargets(targetsList);
      if (list.includes("ALL")) return "All Houses";
      return list.map(code => HOUSE_META[code]?.name || code).join(", ");
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <main class="login-page">
          <form class="login-card" id="loginForm">
            <div class="logo">📢</div>
            <h1>Admin Login</h1>
            <p>JGCC Smart Bulletin Board</p>
            <label>Username</label>
            <input id="username" required placeholder="Enter username">
            <label>Password</label>
            <input id="password" type="password" required placeholder="Enter password">
            <div id="loginMessage"></div>
            <button class="primary-button">Login</button>
          </form>
        </main>
      `;

      document.getElementById("loginForm").onsubmit = function(event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        if (username === USERNAME && password === PASSWORD) {
          sessionStorage.setItem("adminLoggedIn", "true");
          renderAdmin();
        } else {
          document.getElementById("loginMessage").innerHTML =
            `<div class="error">Invalid username or password.</div>`;
        }
      };
    }

    function createNoticeCard(notice) {
      const priorityClass = notice.priority.toLowerCase();
      return `
        <article class="notice-card ${priorityClass}">
          <div class="notice-top">
            <span class="badge">${escapeHTML(notice.priority)}</span>
            <span class="badge">${escapeHTML(houseLabels(notice.targetHouses || [notice.targetHouse || "ALL"]))}</span>
          </div>
          <h3>${escapeHTML(notice.title)}</h3>
          <p>${escapeHTML(notice.message)}</p>
          <div class="notice-bottom">
            <span>${formatDate(notice.createdAt)}</span>
            <div class="notice-actions">
              ${ notice.active ? `<button class="small-button" onclick="archiveNotice('${notice.id}')">Archive</button>` : `<span>Archived</span>` }
              <button class="small-button delete-button" onclick="removeNotice('${notice.id}')">Delete</button>
            </div>
          </div>
        </article>
      `;
    }

    async function renderAdmin() {
      const notices = await refreshFromSharedStore();
      const active = notices.filter(notice => notice.active);

      document.getElementById("app").innerHTML = `
        <main>
          <header class="admin-header">
            <div>
              <h1>JGCC Smart Bulletin Board</h1>
              <p>Administrator Dashboard</p>
            </div>
            <div class="header-actions">
              <span class="connection-status">● Shared Storage Ready</span>
              <button class="logout-button" id="logoutButton">Logout</button>
            </div>
          </header>

          <section class="dashboard-grid">
            <div class="stat-card"><strong>${active.length}</strong><span>Active Notices</span></div>
            <div class="stat-card"><strong>${active.filter(n => normalizeTargets(n.targetHouses || [n.targetHouse || "ALL"]).includes("RH")).length}</strong><span>Green House Notices</span></div>
            <div class="stat-card"><strong>${active.filter(n => normalizeTargets(n.targetHouses || [n.targetHouse || "ALL"]).includes("SH")).length}</strong><span>Blue House Notices</span></div>
            <div class="stat-card"><strong>${active.filter(n => normalizeTargets(n.targetHouses || [n.targetHouse || "ALL"]).includes("TH")).length}</strong><span>Red House Notices</span></div>
          </section>

          <section class="admin-content">
            <form class="form-panel" id="noticeForm">
              <h2>Create New Notice</h2>
              <label>Notice Title</label>
              <input id="noticeTitle" required placeholder="Example: Football Practice">
              <label>Notice Message</label>
              <textarea id="noticeMessage" rows="6" required placeholder="Write notice details..."></textarea>
              <div class="form-row">
                <div>
                  <label>Select House(s)</label>
                  <div class="checkbox-grid">
                    ${["RH", "SH", "TH"].map(code => `
                      <div class="house-option">
                        <input type="checkbox" id="house-${code}" name="houseGroup" value="${code}">
                        <label for="house-${code}">${HOUSE_META[code].name}</label>
                      </div>
                    `).join("")}
                  </div>
                </div>
                <div>
                  <label>Priority</label>
                  <select id="priority">
                    <option value="Normal">Normal</option>
                    <option value="Important">Important</option>
                    <option value="Urgent">Urgent</option>
                  </select>
                </div>
              </div>
              <button class="primary-button">Publish Notice</button>
              <div id="publishMessage"></div>
            </form>

            <section class="notices-panel">
              <h2>Notice History</h2>
              ${notices.length ? notices.map(createNoticeCard).join("") : "<p>No notices published yet.</p>"}
            </section>
          </section>

          <section class="links-panel">
            <h2>House Display Links</h2>
            ${["RH","SH","TH"].map(code => `
              <div class="display-link">
                <strong>${HOUSE_META[code].name}</strong>
                <code>${location.origin}${location.pathname.replace("admin.html","house.html")}?house=${code}</code>
                <a href="house.html?house=${code}" target="_blank">Open Display</a>
              </div>
            `).join("")}
          </section>
        </main>
      `;

      document.getElementById("logoutButton").onclick = function() {
        sessionStorage.removeItem("adminLoggedIn");
        renderLogin();
      };

      document.getElementById("noticeForm").onsubmit = async function(event) {
        event.preventDefault();

        const title = document.getElementById("noticeTitle").value.trim();
        const message = document.getElementById("noticeMessage").value.trim();
        const priority = document.getElementById("priority").value;
        const selectedHouses = [...document.querySelectorAll('input[name="houseGroup"]:checked')].map(input => input.value);

        if (!title || !message) return;

        const current = await refreshFromSharedStore();
        current.unshift({
          id: createId(),
          title,
          message,
          priority,
          targetHouses: selectedHouses.length ? selectedHouses : ["ALL"],
          targetHouse: selectedHouses.length ? selectedHouses[0] : "ALL",
          active: true,
          createdAt: new Date().toISOString()
        });

        await saveNotices(current);
        document.getElementById("noticeForm").reset();
        document.getElementById("publishMessage").innerHTML = `<div class="success">Notice published successfully.</div>`;
        setTimeout(renderAdmin, 700);
      };
    }

    async function archiveNotice(id) {
      const notices = await refreshFromSharedStore();
      const updated = notices.map(notice => notice.id === id ? { ...notice, active: false } : notice);
      await saveNotices(updated);
      renderAdmin();
    }

    async function removeNotice(id) {
      if (!confirm("Delete this notice permanently?")) return;
      const notices = await refreshFromSharedStore();
      const updated = notices.filter(notice => notice.id !== id);
      await saveNotices(updated);
      renderAdmin();
    }

    window.addEventListener("storage", function(event) {
      if (event.key === STORAGE_KEY) {
        renderAdmin();
      }
    });

    if (sessionStorage.getItem("adminLoggedIn") === "true") {
      renderAdmin();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
